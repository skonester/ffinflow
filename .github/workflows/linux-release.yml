name: Linux Release

# Runs automatically after a manual "Windows Release" run succeeds (that run
# creates the v<version> release), or on its own via "Run workflow".
on:
  workflow_run:
    workflows: ["Windows Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-flatpak:
    name: Build Linux x86_64 Flatpak
    # Skip the extra Windows run that publishing the release (which creates
    # the tag) triggers, and Windows runs that failed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    # Flathub's CI image ships flatpak-builder with the freedesktop 24.08
    # Platform and SDK preinstalled, so the ~1 GB runtime download (which kept
    # stalling on plain Ubuntu runners) doesn't happen on every run.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged

    steps:
      # LFS is skipped on purpose: the only LFS files are the Windows .exe
      # binaries, which the Linux package doesn't use.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Build the same commit the Windows run released.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Read version
        id: version
        run: |
          version="$(grep -m1 '"version"' package.json | cut -d'"' -f4)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install Electron BaseApp
        timeout-minutes: 15
        run: |
          command -v xz >/dev/null || dnf install -y xz
          flatpak --version
          flatpak remote-add --system --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak list --system --runtime --columns=application,branch
          flatpak install --system -y --no-related flathub org.electronjs.Electron2.BaseApp//24.08

      - name: Install dependencies
        run: npm ci

      - name: Fetch Linux GPL ffmpeg and yt-dlp binaries
        run: bash ./fetch-linux-binaries.sh

      - name: Compile TypeScript
        run: npm run compile

      - name: Validate JavaScript syntax
        run: |
          node --check out/main.js
          node --check out/renderer.js
          node --check out/menu-template.js
          node --check out/subtitles.js

      # rofiles-fuse needs FUSE, which isn't usable inside the container, so
      # flatpak-builder has to run with --disable-rofiles-fuse (as Flathub's
      # own CI does). electron-builder has no option to pass builder args, so
      # a wrapper earlier on PATH adds it.
      - name: Wrap flatpak-builder
        run: |
          real="$(command -v flatpak-builder)"
          dir="${RUNNER_TEMP}/flatpak-builder-wrapper"
          mkdir -p "$dir"
          cat > "$dir/flatpak-builder" <<EOF
          #!/bin/sh
          case "\$1" in
            --version) exec "$real" "\$@" ;;
            *) exec "$real" --disable-rofiles-fuse "\$@" ;;
          esac
          EOF
          chmod +x "$dir/flatpak-builder"
          echo "$dir" >> "$GITHUB_PATH"

      - name: Build flatpak
        timeout-minutes: 30
        env:
          # Prints flatpak-builder's own output, which electron-builder hides.
          DEBUG: "@malept/flatpak-bundler"
        run: npx electron-builder --linux flatpak --x64 --publish never

      - name: Verify bundled binaries
        run: |
          for bin in ffmpeg-binaries/ffmpeg ffmpeg-binaries/ffprobe ytdlp-binaries/yt-dlp; do
            test -x "dist/linux-unpacked/resources/$bin" || { echo "missing or not executable: $bin" >&2; exit 1; }
          done
          ls -lh dist/*.flatpak

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ffinflow-linux-flatpak
          path: dist/*.flatpak
          if-no-files-found: warn

  # Runs on a plain runner because the flatpak container has no gh CLI.
  # Attaches the flatpak to the v<version> release the Windows run created;
  # if there is none yet, creates the draft the same way electron-builder
  # does (electron-builder reuses an existing draft for the same tag).
  attach-to-release:
    name: Attach Flatpak to Release
    needs: build-flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Download flatpak
        uses: actions/download-artifact@v5
        with:
          name: ffinflow-linux-flatpak
          path: dist

      - name: Attach flatpak to release
        env:
          VERSION: ${{ needs.build-flatpak.outputs.version }}
          TARGET: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          tag="v${VERSION}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft \
              --title "$VERSION" --target "$TARGET" --notes ""
          fi
          gh release upload "$tag" dist/*.flatpak --repo "$GITHUB_REPOSITORY" --clobber
          # Windows .exe and Linux .flatpak are both attached now: make the
          # release public.
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
